<ion-content [fullscreen]="true">
  <div class="home-container">

    <div class="logo-section">
      <h1>Rutas Seguras</h1>
      <p>Transporte escolar seguro y confiable</p>
    </div>

    <div class="welcome-section">
      <h2>¡Bienvenido!</h2>
      <p>Selecciona cómo deseas ingresar</p>
    </div>

    <div class="options-section">

      <ion-button
        expand="block"
        class="role-button"
        routerLink="/login"
        [queryParams]="{ rol: 'apoderado' }">

        Soy Apoderado

      </ion-button>

      <ion-button
        expand="block"
        fill="outline"
        class="role-button"
        routerLink="/login"
        [queryParams]="{ rol: 'conductor' }">

        Soy Conductor

      </ion-button>

    </div>

  </div>
</ion-content>
