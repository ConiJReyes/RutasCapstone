<ion-content [fullscreen]="true">

  <div class="login-page">

    <!-- Decoración superior -->
    <button class="back-button" type="button" (click)="volver()">

      <ion-icon name="arrow-back-outline"></ion-icon>

    </button>


    <!-- HERO -->
    <section class="hero-section">

      <img src="assets/images/bus-escolar.png" alt="Bus escolar Rutas Seguras" class="bus-image" />

      <h1>Rutas Seguras</h1>

      <p>
        TU RUTA ESCOLAR, MÁS SEGURA
      </p>

    </section>


    <!-- TARJETA INFERIOR -->
    <section class="login-card">

      <form (ngSubmit)="onSubmit()">

        <!-- Correo -->
        <div class="input-wrapper">

          <ion-item lines="none">

            <ion-icon slot="start" name="person-outline">
            </ion-icon>

            <ion-input label="Correo o Teléfono" labelPlacement="floating" type="email" name="email" [(ngModel)]="email"
              placeholder="Correo o Teléfono" required>
            </ion-input>

          </ion-item>

        </div>


        <!-- Contraseña -->
        <div class="input-wrapper">

          <ion-item lines="none">

            <ion-icon slot="start" name="lock-closed-outline">
            </ion-icon>

            <ion-input label="Contraseña" labelPlacement="floating" type="password" name="password"
              [(ngModel)]="password" placeholder="Contraseña" required>
            </ion-input>

          </ion-item>

        </div>


        <!-- Recuperar contraseña -->
        <div class="forgot-password">

          <a [routerLink]="['/recuperar-password']" [queryParams]="{ rol: rol }">

            ¿Olvidaste la<br>
            contraseña?

          </a>

        </div>


        <!-- Error -->
        @if (errorMensaje) {

        <div class="error-message">
          {{ errorMensaje }}
        </div>

        }


        <!-- Iniciar sesión -->
        <ion-button expand="block" type="submit" class="login-button" [disabled]="cargando">

          @if (cargando) {

          <ion-spinner name="crescent"></ion-spinner>

          } @else {

          Iniciar Sesión

          }

        </ion-button>


        <!-- Separador -->
        @if (rol === 'apoderado' || !rol) {

        <div class="separator">
          o
        </div>


        <!-- Crear cuenta -->
        <ion-button expand="block" fill="clear" routerLink="/registro" class="register-button">

          Crear Cuenta

        </ion-button>

        }

      </form>

    </section>


    <!-- Identificador del rol -->
    @if (rol === 'conductor') {

    <div class="role-label">
      Acceso exclusivo para conductores
    </div>

    }

  </div>

</ion-content>
