<div class="modal-overlay" (click)="cerrarModal()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div>
        <h3>Seguimiento en Vivo</h3>
        <p class="subtitle">{{ rutaNombre }}</p>
      </div>
      <button class="close-btn" (click)="cerrarModal()">&times;</button>
    </div>

    @if (necesitaDireccion) {
      <div class="direccion-form">
        <h4>Configurar Puntos del Recorrido</h4>
        <p>Selecciona la dirección del apoderado para establecer el origen exacto del recorrido.</p>

        <div class="form-grid">
          <div class="form-group">
            <label>Región</label>
            <select [(ngModel)]="dirApoderado.region" (ngModelChange)="onRegionSelect($event)" class="select-control">
              <option value="" disabled>-- Selecciona una región --</option>
              @for (reg of regiones; track reg) {
                <option [value]="reg">{{ reg }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label>Comuna</label>
            <select [(ngModel)]="dirApoderado.comuna" class="select-control" [disabled]="!dirApoderado.region">
              <option value="" disabled>-- Selecciona una comuna --</option>
              @for (com of comunasDisponibles; track com) {
                <option [value]="com">{{ com }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label>Calle</label>
            <input type="text" [(ngModel)]="dirApoderado.calle" placeholder="Ej: Victor Jara" class="input-control" />
          </div>

          <div class="form-group">
            <label>Número</label>
            <input type="text" [(ngModel)]="dirApoderado.numero" placeholder="Ej: 549" class="input-control" />
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="confirm-btn" (click)="procesarDireccionesYIniciar()" [disabled]="cargandoGeo">
            {{ cargandoGeo ? 'Cargando Mapa...' : 'Iniciar seguimiento' }}
          </button>
        </div>
      </div>
    } @else {
      <div class="map-wrapper">
        <div #mapContainer class="map-container"></div>
      </div>
    }
  </div>
</div>
