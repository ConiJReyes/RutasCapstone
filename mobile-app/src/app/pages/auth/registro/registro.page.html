<ion-content [fullscreen]="true">

  <div class="register-container">

    <div class="header-section">
      <h1>Crear cuenta</h1>

      <p>
        Regístrate como apoderado para utilizar Rutas Seguras.
      </p>
    </div>

    <form (ngSubmit)="onSubmit()" class="form-section">

      <ion-item>
        <ion-input
          label="Nombre *"
          labelPlacement="floating"
          type="text"
          name="nombre"
          [(ngModel)]="nombre"
          placeholder="Ingresa tu nombre"
          required>
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Apellido *"
          labelPlacement="floating"
          type="text"
          name="apellido"
          [(ngModel)]="apellido"
          placeholder="Ingresa tu apellido"
          required>
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="RUT *"
          labelPlacement="floating"
          type="text"
          name="rut"
          [(ngModel)]="rut"
          placeholder="12.345.678-9"
          required>
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Correo electrónico *"
          labelPlacement="floating"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="correo@ejemplo.com"
          required>
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Teléfono"
          labelPlacement="floating"
          type="tel"
          name="telefono"
          [(ngModel)]="telefono"
          placeholder="+56 9 1234 5678">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Contraseña *"
          labelPlacement="floating"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingresa una contraseña"
          required>
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Confirmar contraseña *"
          labelPlacement="floating"
          type="password"
          name="confirmarPassword"
          [(ngModel)]="confirmarPassword"
          placeholder="Repite tu contraseña"
          required>
        </ion-input>
      </ion-item>

      @if (errorMensaje) {
        <div style="color: var(--ion-color-danger, red); margin-top: 10px; font-size: 0.9rem; text-align: center;">
          {{ errorMensaje }}
        </div>
      }

      <ion-button expand="block" type="submit" [disabled]="cargando" style="margin-top: 20px;">
        @if (cargando) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Crear cuenta
        }
      </ion-button>

      <div class="login-section">

        <p>¿Ya tienes una cuenta?</p>

        <ion-button
          fill="clear"
          routerLink="/login">
          Iniciar sesión
        </ion-button>

      </div>

    </form>

  </div>

</ion-content>
